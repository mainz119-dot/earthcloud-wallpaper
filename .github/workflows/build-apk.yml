name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip project
        run: unzip -q project.zip -d src

      - name: Build debug APK
        shell: bash
        working-directory: src
        run: |
          gradle :app:assembleDebug 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        working-directory: src
        run: |
          echo "===== Kotlin errors ====="
          grep -E "^e: " build.log | head -40 || true
          echo "===== log tail ====="
          tail -40 build.log

      - uses: actions/upload-artifact@v4
        with:
          name: EarthCloudWallpaper-debug-apk
          path: src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
